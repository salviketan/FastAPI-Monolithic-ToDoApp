# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker compose reference guide at
# https://docs.docker.com/compose/compose-file/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose

# The commented out section below is an example of how to define a PostgreSQL
# database that your application can use. `depends_on` tells Docker Compose to
# start the database before your application. The `db-data` volume persists the
# database data between container restarts. The `db-password` secret is used
# to set the database password. You must create `db/password.txt` and add
# a password of your choosing to it before running `docker compose up`.

version: '3.8'

services:
  app_db:
    hostname: app_db
    image: docker.io/library/postgres:18.2-alpine3.22
    # restart: always
    user: postgres
    secrets:
      - db-user
      - db-password
    environment:
      - POSTGRES_USER_FILE=/run/secrets/db-user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    volumes:
      - postgres_data:/var/lib/postgresql
    expose:
      - 5432
    ports:
      - 8002:5432
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "app_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  app_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ketansalvi/app:toDo_app_v1.0
    working_dir: /todo_app/backend
    command: ["uv", "run", "run.py"]
    ports:
      - 8001:8000
    environment:
      # 1. Force uv to put the environment in a clean, writable path
      - UV_PROJECT_ENVIRONMENT=/tmp/venv
      - UV_CACHE_DIR=/tmp/uv-cache
    volumes:
      - ./backend:/todo_app/backend:z
      - migrations:/todo_app/backend/app/alembic/versions
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    depends_on:
      - app_db
  
  app_nginx:
    build:
      context: ./nginx
      dockerfile: ./Dockerfile
    image: ketansalvi/app:app_nginx_v1.0
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    depends_on:
      - app_db
      - app_service
    ports:
      - 8000:80

volumes:
  postgres_data:
  migrations:

secrets:
  db-user:
    file: ./db_creds/user.txt
  db-password:
    file: ./db_creds/password.txt